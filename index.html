<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4064/4064276.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WeatherBully">
    <link rel="apple-touch-icon" href="icon.png">

    <meta name="theme-color" content="#0f172a">
    <title>WeatherBully Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="custom-select-container">
                <div class="select-selected" id="selected-item">
                    <span>75 - Paris</span>
                    <i class="arrow"></i>
                </div>
                <div class="select-items select-hide" id="options-list">
                    </div>
            </div>
            <p id="date">-- -- ----</p>
        </header>

        <main>
            <div class="weather-main">
                <div id="weather-icon">☀️</div>
                <h2 id="temperature">--°C</h2>
                <p id="condition">Analyse des données...</p>
            </div>

            <div class="threat-line">
                <span id="threat-text">Initialisation du système de surveillance...</span>
            </div>

            <div class="details-grid">
                <div class="detail-card">
                    <span>Humidité</span>
                    <b id="humidity">--%</b>
                </div>
                <div class="detail-card">
                    <span>Vent</span>
                    <b id="wind">-- km/h</b>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
